name: Build Packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build core package
        run: npm run build --workspace=@icrules/core
      
      - name: Build editor package
        run: npm run build --workspace=@icrules/editor
      
      - name: Build examples package
        run: npm run build --workspace=@icrules/examples
      
      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-lib
          path: packages/core/lib
          retention-days: 7

      - name: Upload editor artifacts
        uses: actions/upload-artifact@v4
        with:
          name: editor-lib
          path: packages/editor/lib
          retention-days: 7 